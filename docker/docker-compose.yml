x-dds-environment: &dds-environment
  # Fast DDS is the live-verified Dog 2 path. Switch explicitly to CycloneDDS
  # only after rebuilding an image that passes the runtime-library check.
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///opt/cyclonedds_eth0.xml}
  FASTRTPS_DEFAULT_PROFILES_FILE: /opt/fastrtps_eth0_only.xml

services:
  driver:
    build: .
    image: go2-lidar-humble:latest
    container_name: go2-lidar-driver
    # The Livox SDK binds directly to the host's LiDAR-subnet IP -- it
    # doesn't go through Docker's usual NAT'd bridge network at all, so
    # bridge networking fails with "bind failed" (confirmed while testing
    # this image without a real 192.168.1.x interface present). Host
    # networking is required, not just convenient.
    network_mode: host
    # Deliberately NOT using ${VAR:?message} here -- Compose interpolates
    # every service's environment/volumes block for the whole file up
    # front, before profile filtering decides which services actually run.
    # A required-var error on an unrelated service would break plain
    # `docker compose build` even with no .env present. LIVOX_LIDAR_IP is
    # still enforced -- just at the right time, by entrypoint.sh inside the
    # container, when the driver command actually runs.
    environment:
      <<: *dds-environment
      LIVOX_LIDAR_IP: ${LIVOX_LIDAR_IP:-}
      LIVOX_HOST_IP: ${LIVOX_HOST_IP:-192.168.1.50}
    command: ["driver"]
    restart: unless-stopped
    profiles: ["hardware"]

  fastlio:
    image: go2-lidar-humble:latest
    container_name: go2-fastlio
    network_mode: host
    environment: *dds-environment
    volumes:
      - ./config/mid360.yaml:/opt/fastlio-config/mid360.yaml:ro
    # Use the repository-owned live configuration without rebuilding the
    # image. In particular, this disables upstream's unlimited PCD retention,
    # which otherwise grows until the mapper exits or exhausts memory.
    command:
      - ros2
      - launch
      - fast_lio
      - mapping.launch.py
      - config_path:=/opt/fastlio-config
      - config_file:=mid360.yaml
      - rviz:=false
    restart: unless-stopped
    profiles: ["hardware", "replay", "export"]

  # Replay profile -- stands in for the live driver when no LiDAR/Jetson is
  # reachable. Plays a recorded rosbag at (roughly) real-time rate against a
  # live FastLIO instance, so the rest of the pipeline sees the same message
  # stream/timing it would from a real sensor. Needs BAG_PATH set (in .env)
  # to a directory containing metadata.yaml + a .db3 file (e.g. one of
  # Kei's recordings under kei-stuff/ros2-go2/bag/). Falls back to mounting
  # this directory if BAG_PATH is unset, which fails clearly at
  # `docker compose up bag` time ("no bag found") rather than at parse time
  # -- see the driver service's comment above for why there's no
  # required-var check at the Compose level.
  bag:
    image: go2-lidar-humble:latest
    container_name: go2-bag-replay
    network_mode: host
    environment: *dds-environment
    volumes:
      # rosbag2's sqlite3 storage plugin needs write access to the bag's
      # own directory even just to play it back -- it opens the database
      # read-only, but a bag recorded without WAL/SHM sidecar files
      # already present (e.g. kei-stuff's lab_walk_no_stop/
      # lab_walk_with_stops sessions, unlike the two-dog recordings that
      # already carry them) fails outright under :ro with a misleading
      # "Could not load/open plugin with storage id 'sqlite3'" error, not
      # an obvious permissions message. Confirmed by reproducing the
      # failure under :ro and it going away under :rw.
      - ${BAG_PATH:-.}:/bag:rw
    # Small delay so FastLIO's subscriber is up before the first message --
    # matches the inherited manual "wait for Node init finished" step;
    # without it the bag's first IMU/LiDAR messages can arrive before
    # FastLIO is subscribed and get silently dropped.
    command: ["bash", "-c", "sleep 5 && ros2 bag play /bag"]
    profiles: ["replay", "export"]
    depends_on:
      - fastlio

  # Raw-data recorder for field experiments. It deliberately records only
  # the sensor inputs so the same capture can be replayed through different
  # FastLIO/perception settings without conflicting recorded output topics.
  # Stop it with `docker compose --profile record stop -t 30 recorder` so
  # rosbag2 receives SIGTERM and finishes metadata.yaml cleanly.
  recorder:
    image: go2-lidar-humble:latest
    container_name: go2-bag-recorder
    network_mode: host
    environment:
      <<: *dds-environment
      RECORD_NAME: ${RECORD_NAME:-}
    volumes:
      - ${RECORD_OUTPUT_DIR:-../bags}:/bags:rw
    command:
      - bash
      - -c
      - >-
        : "$${RECORD_NAME:?set a unique RECORD_NAME in .env}";
        exec ros2 bag record -o "/bags/$${RECORD_NAME}"
        /livox/lidar /livox/imu
    profiles: ["record"]

  # Online perception prototype -- subscribes to /cloud_registered +
  # /Odometry live instead of batch-processing PCD files from disk. See
  # perception/README.md for what it does and doesn't do yet.
  perception:
    image: go2-lidar-humble:latest
    container_name: go2-online-perception
    network_mode: host
    environment:
      <<: *dds-environment
      DOG_ID: ${DOG_ID:-dog}
    volumes:
      - ../perception:/opt/perception:ro
    command:
      - "python3"
      - "/opt/perception/online_perception_node.py"
      - "--ros-args"
      - "-p"
      - "use_occlusion_accumulation:=${USE_OCCLUSION_ACCUMULATION:-false}"
      - "-p"
      - "use_free_space_detection:=${USE_FREE_SPACE_DETECTION:-false}"
      - "-p"
      - "use_temporal_consensus:=${USE_TEMPORAL_CONSENSUS:-false}"
      - "-p"
      - "temporal_history_frames:=${TEMPORAL_HISTORY_FRAMES:-3}"
      - "-p"
      - "temporal_min_changed_ratio:=${TEMPORAL_MIN_CHANGED_RATIO:-0.5}"
      - "-p"
      - "accumulate_scans:=${PERCEPTION_ACCUMULATE_SCANS:-10}"
      - "-p"
      - "accumulate_stride:=${PERCEPTION_ACCUMULATE_STRIDE:-0}"
      - "-p"
      - "cluster_min_points:=${PERCEPTION_CLUSTER_MIN_POINTS:-10}"
    profiles: ["hardware", "replay"]
    depends_on:
      - fastlio

  # Conservative first response layer. It converts confirmed, current
  # perception tracks into a time-debounced Bool stop request. It has no
  # direct connection to /api/sport/request; the separately-enabled adapter
  # below owns that safety boundary.
  response:
    image: go2-lidar-humble:latest
    container_name: go2-cluster-response
    network_mode: host
    environment: *dds-environment
    volumes:
      - ../perception:/opt/perception:ro
    command: ["python3", "/opt/perception/cluster_response_node.py"]
    profiles: ["hardware", "replay"]
    depends_on:
      - perception

  # Disabled-by-default Unitree boundary. This service always runs so bag
  # replay exercises the complete decision path, but ACTUATION_ENABLED must
  # be set explicitly before it can publish StopMove on /api/sport/request.
  # Clearing a request never resumes motion automatically.
  actuation:
    image: go2-lidar-humble:latest
    container_name: go2-stop-actuation
    network_mode: host
    environment: *dds-environment
    volumes:
      - ../perception:/opt/perception:ro
    command:
      - python3
      - /opt/perception/stop_actuation_node.py
      - --ros-args
      - -p
      - enabled:=${ACTUATION_ENABLED:-false}
    profiles: ["hardware", "replay"]
    depends_on:
      - response

  # Optional low-bandwidth inter-dog prototype. DDS stays on each dog's
  # eth0; only authenticated track JSON is sent explicitly over UDP to the
  # configured WiFi/Tailscale peer. Start alongside hardware with both
  # `--profile hardware --profile shared`; it is not part of the default
  # single-dog path.
  track-exchange:
    image: go2-lidar-humble:latest
    container_name: go2-track-exchange
    network_mode: host
    environment:
      <<: *dds-environment
      DOG_ID: ${DOG_ID:-dog}
      TRACK_EXCHANGE_ENABLED: ${TRACK_EXCHANGE_ENABLED:-false}
      TRACK_PEER_HOST: ${TRACK_PEER_HOST:-}
      TRACK_EXCHANGE_PORT: ${TRACK_EXCHANGE_PORT:-47020}
      TRACK_SHARED_SECRET: ${TRACK_SHARED_SECRET:-}
    volumes:
      - ../merge:/opt/merge:ro
    command: ["python3", "/opt/merge/track_exchange_node.py"]
    profiles: ["shared"]

  shared-fusion:
    image: go2-lidar-humble:latest
    container_name: go2-shared-track-fusion
    network_mode: host
    environment:
      <<: *dds-environment
      DOG_ID: ${DOG_ID:-dog}
      PEER_DOG_ID: ${PEER_DOG_ID:-peer}
      LOCAL_TO_SHARED: ${LOCAL_TO_SHARED:-0,0,0,0}
      REMOTE_TO_SHARED: ${REMOTE_TO_SHARED:-0,0,0,0}
    volumes:
      - ../merge:/opt/merge:ro
    command: ["python3", "/opt/merge/shared_track_fusion_node.py"]
    profiles: ["shared"]

  # Batch bag -> PCD/poses export -- the one-command replacement for Kei's
  # original WSL2/Jazzy export_fastlio.py workflow, so a new bag can be
  # turned into evaluation/'s
  # expected data/<session>/pcd/ + poses.csv layout without a second ROS
  # distro on a laptop. Separate profile from `replay` rather than folding
  # into it -- exporting and running the live perception node against the
  # same bag are different tasks that don't need to happen together, and
  # `perception` would otherwise compete with `export` for the one bag
  # replay's messages for no benefit to either.
  #
  # Needs BAG_PATH (same as the `bag` service above) and, optionally,
  # EXPORT_OUTPUT_DIR (defaults to ../data/export if unset) and
  # EXPORT_ACCUMULATE (defaults to 10, matching export_fastlio.py's own
  # default). Stop with Ctrl+C (or `docker compose --profile export down`)
  # once the `bag` service's log shows playback finished -- see
  # ../export/README.md for why SIGTERM/SIGINT both flush cleanly.
  export:
    image: go2-lidar-humble:latest
    container_name: go2-bag-export
    network_mode: host
    environment: *dds-environment
    volumes:
      - ../export:/opt/export:ro
      - ${EXPORT_OUTPUT_DIR:-../data/export}:/output:rw
    command: ["python3", "/opt/export/export_fastlio.py", "/output", "--accumulate", "${EXPORT_ACCUMULATE:-10}"]
    profiles: ["export"]
    depends_on:
      - fastlio
